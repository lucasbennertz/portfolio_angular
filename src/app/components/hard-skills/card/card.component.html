<mat-card class="skill-card">
    <mat-card-content>
        <p class="skill-name">{{nomeHabilidade}}</p>
        <fa-icon [icon]="iconHabilidade!" *ngIf="iconHabilidade != null;else imagem"></fa-icon>
        <ng-template #imagem>
            <img [src]="urlIconHabilidade" alt="teste">
        </ng-template>
    </mat-card-content>
</mat-card>
