<div class="hard-skills-container" id="habilidades">
    <div class="imagem">
      <img src="/Codigos.webp" alt="">
    </div>
  
    <div class="texto">
      <h1>Minhas habilidades</h1>
  
      <div class="cards-wrapper">
        <app-card 
          *ngFor="let skill of hardSkills"
          [iconHabilidade]="skill.iconName"
          [nomeHabilidade]="skill.nome"
          [urlIconHabilidade]="skill.iconUrl" >
        </app-card>
      </div>
    </div>
  </div>
